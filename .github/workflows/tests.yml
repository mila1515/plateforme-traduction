# Vérifie chaque push et pull request avec les versions verrouillées, sans clé API réelle.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      DEEPL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check .
      - run: python -m pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target application -t platforme-traduction:ci .
