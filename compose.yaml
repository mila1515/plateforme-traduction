services:
  traduction:
    build:
      context: .
      target: application
    image: platforme-traduction:local
    ports:
      - "127.0.0.1:8502:8501"
    env_file:
      - .env
    # Mémoire de traduction : conservée sur le poste, hors de l'image.
    volumes:
      - ./data/memory:/app/data/memory
    restart: unless-stopped
  tests:
    build:
      context: .
      target: tests
    image: platforme-traduction-tests:local
    restart: "no"
    network_mode: none
    environment:
      OPENAI_API_KEY: ""
      DEEPL_API_KEY: ""
    volumes:
      - ./app.py:/app/app.py:ro
      - ./services:/app/services:ro
      - ./tests:/app/tests:ro
      - ./examples:/app/examples:ro
      - ./evaluation:/app/evaluation:ro
      - ./data/glossaries:/app/data/glossaries:ro
